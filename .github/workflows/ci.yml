name: CI

# デジタコの運行 CSV の Worker alc-dtako の検査 (ippoan/alc-vein-worker の ci.yml の形。Refs ippoan/rust-alc-api#725)。
# 公開範囲の検査・fmt・clippy・crates/alc-dtako-upload の DB のテストと共通の計算 crate 2 つのテスト・coverage の gate・wasm のビルド。
# デプロイは deploy.yml (別 workflow)。
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # PR の古い run は捨てるが、main は途中で切らない
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # `wrangler dev` を使う検査 (後続の PR で入る) の版。deploy.yml の WRANGLER_VERSION と揃える
  WRANGLER_VERSION: 4.144.0

jobs:
  # 先頭の check-exposure.sh は「外から素で届かない」(本番は workers_dev / preview_urls = false、
  # route / routes 無し。workers_dev = true は Cloudflare Access で守る env.staging だけ) の検査 —
  # この Worker は X-Tenant-ID を信頼するので、崩れたら ippoan/rust-alc-api#556 と同じ穴になる。
  # check-exposure-test.sh はその陰性対照 (wrangler.toml を崩すと exit 1 になること)。
  dtako-worker:
    name: Dtako Worker (wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 外から直接届かないことの検査 (wrangler.toml)
        run: bash scripts/check-exposure.sh
      - name: check-exposure.sh の陰性対照
        run: bash scripts/check-exposure-test.sh
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy, llvm-tools-preview
      - uses: swatinem/rust-cache@v2
        with:
          shared-key: dtako-worker
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --check
      - run: cargo clippy --locked --target wasm32-unknown-unknown --release -- -D warnings
      # 共通の計算 crate 2 つ (正本はこの repo。Refs ippoan/rust-alc-api#736)。native は rust-alc-api と同じ形 (`--tests` 無し)。
      # wasm32 は alc-csv-parser の既定 feature `zip-extract` (zip の C の依存) を外す (worker が引く形と同じ)
      - run: cargo clippy --locked -p alc-compare -p alc-csv-parser -- -D warnings
      - run: cargo clippy --locked --target wasm32-unknown-unknown --release -p alc-compare -p alc-csv-parser --lib --no-default-features -- -D warnings
      # テスト (組み込みの PostgreSQL) が流す SQL を ippoan/alc-migrations から取る (版は scripts/ALC_MIGRATIONS_REV)
      - run: bash scripts/fetch-migrations.sh
      - uses: taiki-e/install-action@cargo-llvm-cov
      # crates/alc-dtako-upload の tests/sql_db.rs (組み込みの PostgreSQL。docker も env も要らない)・tests/store.rs
      # (偽の保存先)・tests/split_flow.rs・tests/upload_flow.rs (口から DB・偽の保存先まで) を、計測つきで 1 回だけ走らせる (素の cargo test と分けると、dev-dependency を 2 回 compile することになる)。
      # テストの target ごとに本数を固定する (減ったら落ちる。テストを足したらここの数も上げる)。
      # 共通の計算 crate 2 つ (alc-compare・alc-csv-parser) は、dtako-upload とは別の回で計測する (feature をまとめない。
      # 各回の前に clean するので、ほかの crate のテストが踏んだ行を数えない)。llvm-cov の下では `cfg_attr(not(coverage), ignore)` の
      # テストも走るので、本数は ignored 0 で固定する。gate は 3 回の報告をまとめて 1 回で見る。
      # 行カバレッジ 100% の gate の登録簿は直下の coverage_100.toml
      - name: sql_db・store・split_flow・upload_flow・alc-compare・alc-csv-parser + Coverage 100% gate
        run: |
          set -o pipefail
          # 前の計測の残り (cache から戻った profraw) を数えない
          cargo llvm-cov clean --workspace
          cargo llvm-cov --locked -p alc-dtako-upload --no-report 2>&1 | tee "$RUNNER_TEMP/alc-dtako-upload-test.txt"
          # target ごとの結果の行だけを見る (ほかの target の行と取り違えない)
          awk '/Running.*tests\/sql_db\.rs \(/{f=1} f && /^test result:/{print; exit}' "$RUNNER_TEMP/alc-dtako-upload-test.txt" \
            | grep -Eq '^test result: ok\. 18 passed; 0 failed; 0 ignored'
          awk '/Running.*tests\/store\.rs \(/{f=1} f && /^test result:/{print; exit}' "$RUNNER_TEMP/alc-dtako-upload-test.txt" \
            | grep -Eq '^test result: ok\. 10 passed; 0 failed; 0 ignored'
          awk '/Running.*tests\/split_flow\.rs \(/{f=1} f && /^test result:/{print; exit}' "$RUNNER_TEMP/alc-dtako-upload-test.txt" \
            | grep -Eq '^test result: ok\. 20 passed; 0 failed; 0 ignored'
          awk '/Running.*tests\/upload_flow\.rs \(/{f=1} f && /^test result:/{print; exit}' "$RUNNER_TEMP/alc-dtako-upload-test.txt" \
            | grep -Eq '^test result: ok\. 16 passed; 0 failed; 0 ignored'
          # -p を付けないと直下の package (worker) だけが対象になり、報告が空になる
          cargo llvm-cov report --locked -p alc-dtako-upload --text > "$RUNNER_TEMP/alc-dtako-upload-cov.txt"
          for c in alc-compare:128 alc-csv-parser:67; do
            name="${c%%:*}"; count="${c##*:}"
            cargo llvm-cov clean --workspace
            cargo llvm-cov --locked -p "$name" --no-report 2>&1 | tee "$RUNNER_TEMP/$name-test.txt"
            awk '/Running.*unittests src\/lib\.rs \(/{f=1} f && /^test result:/{print; exit}' "$RUNNER_TEMP/$name-test.txt" \
              | grep -Eq "^test result: ok\. $count passed; 0 failed; 0 ignored"
            cargo llvm-cov report --locked -p "$name" --text > "$RUNNER_TEMP/$name-cov.txt"
          done
          bash scripts/check_coverage_100.sh \
            --use-cache "$RUNNER_TEMP/alc-dtako-upload-cov.txt" \
            --use-cache "$RUNNER_TEMP/alc-compare-cov.txt" \
            --use-cache "$RUNNER_TEMP/alc-csv-parser-cov.txt"
      # worker-build の版は wrangler.toml の [build] command と揃える
      - run: cargo install -q worker-build@0.8.7 --locked
      - run: worker-build --release
      - name: bundle サイズ (上限 10MB は gzip 後)
        run: |
          raw=$(stat -c%s build/index_bg.wasm)
          gz=$(gzip -9c build/index_bg.wasm | wc -c)
          echo "alc-dtako wasm: raw=${raw} B / gzip=${gz} B" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$gz" -lt 10000000 ] || { echo "::error::gzip 後 ${gz} B が 10MB を超えた"; exit 1; }

  # green の PR を merge する (ippoan/ci-workflows の reusable。merge は GitHub App の token で行う)。
  # この workflow に deploy 系の job は無い (デプロイは deploy.yml。PR では --dry-run だけで、
  # reusable が head SHA の全 check の完了を待つので dry-run の失敗でも merge されない)
  auto-merge:
    name: Auto Merge
    needs: [dtako-worker]
    if: github.event_name == 'pull_request' && needs.dtako-worker.result == 'success'
    uses: ippoan/ci-workflows/.github/workflows/auto-merge.yml@main
    permissions:
      contents: write
      pull-requests: write
      # 無いと startup_failure になる
      checks: read
    secrets:
      CI_APP_ID: ${{ secrets.CI_APP_ID }}
      CI_APP_PRIVATE_KEY: ${{ secrets.CI_APP_PRIVATE_KEY }}
