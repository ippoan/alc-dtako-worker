# デジタコの運行 CSV のアップロード・分割の Worker (Refs ippoan/rust-alc-api#725)。型は ippoan/alc-vein-worker と同じ。
#
# ★ この Worker は JWT を検証せず、auth-worker が付け直した X-Tenant-ID を信頼する。
#   外から直接届いたら ippoan/rust-alc-api#556 と同じ穴になるので、本番 (トップレベル) の到達経路は
#   auth-worker からの Service Binding だけにする:
#   - workers_dev = false / preview_urls = false (*.workers.dev と preview URL を開けない)
#   - route / routes / custom_domain を書かない
#   staging (env.staging) だけはテストから叩くため workers_dev = true にし、その workers.dev の
#   ホスト名は Cloudflare Access で保護する (アプリ・ポリシー・service token は Access 側で管理。
#   Access を通らないリクエストは Worker に届かない)。workers_dev = true を許すのは env.staging だけ。
#   scripts/check-exposure.sh が CI で毎回これを検査する。
# ★ 表の順を変えない・前の方に表を足さない (scripts/check-exposure-test.sh の陰性対照は、特定の表の
#   直前に行を挿して崩す作り。CLAUDE.md)。新しい表は placement の表より後に置く。
name = "alc-dtako"
main = "build/index.js"
compatibility_date = "2026-09-01"
workers_dev = false
preview_urls = false

[build]
command = "cargo install -q worker-build@0.8.7 && worker-build --release"

# 応答ヘッダー x-worker-version / x-worker-tag の元 (src/lib.rs)。binding は env に継承されないので
# トップレベルと env.staging の両方に要る。tag / message は deploy の --tag / --message (deploy.yml)
[version_metadata]
binding = "CF_VERSION_METADATA"

# 本番の DB は aws:ap-northeast-1。Worker をその近くで動かす
[placement]
region = "aws:ap-northeast-1"

# 本番でもログを残す (env に継承されないので、staging は下で別に書く)。口が出すログは、段の名前・kind・件数まで
# (識別子も、エラーの生の文も出さない)。500 の本文は固定の語なので、原因はここでしか追えない
[observability]
enabled = true

# 本番の DB: Cloudflare Hyperdrive の binding DTAKO_HYPERDRIVE (src/db.rs。Refs ippoan/rust-alc-api#723)。
# 設定は実行用ロールのもの 1 つを複数の worker で共有する (worker ごとに作らない。id は ippoan/alc-vein-worker と同じ)。
# 接続先・資格情報・TLS (証明書の検証) は設定の側に在り、ここに書くのは設定の ID だけ。
# binding が在るのに使えないときは 500 (ローカル用の文字列 DATABASE_URL へは落ちない)。
# env.staging / env.local には置かない (binding は env に継承されない。scripts/check-exposure.sh が検査する)。
[[hyperdrive]]
binding = "DTAKO_HYPERDRIVE"
id = "6bdf446634034f989d4e094d5510b162"

# 本番の R2 (運行 CSV の置き場)。binding は env に継承されないので、staging は下で別の bucket を指す
[[r2_buckets]]
binding = "DTAKO_R2"
bucket_name = "ohishi-dtako"

# staging: DB は ippoan/alc-vein-worker の staging と同じもの (Workers VPC の binding DTAKO_DB_VPC から
# 既存の Tunnel 経由で PgBouncer へ繋ぐ。src/db.rs)。Hyperdrive は通さない。
#   npx wrangler@4.144.0 deploy --env staging    (TCP 型の VPC Service は wrangler 4.78.0 以上。README)
[env.staging]
name = "alc-dtako-staging"
workers_dev = true
preview_urls = false

[env.staging.observability]
enabled = true

[env.staging.version_metadata]
binding = "CF_VERSION_METADATA"

# Worker の実行場所を staging の DB の近くに寄せる (ippoan/alc-vein-worker の staging と同じ region)。
# region は強制ではなくヒントで、実際に動いた場所は応答ヘッダー cf-placement で分かる
[env.staging.placement]
region = "aws:ap-northeast-3"

# staging の DB への口 (vein の staging と同じ VPC Service を共有)。本番 (トップレベル) には置かない
# (scripts/check-exposure.sh が検査)
[[env.staging.vpc_services]]
binding = "DTAKO_DB_VPC"
# service_id は VPC Service の参照 (宛先の Tunnel・host:port は Service 側に閉じる)
service_id = "01a0efa3-57ee-7631-912e-7f261d828127"
remote = true

# staging の R2 は staging 用の bucket (本番の bucket を指すと本番の object を上書きする。
# scripts/check-exposure.sh が検査)
[[env.staging.r2_buckets]]
binding = "DTAKO_R2"
bucket_name = "ohishi-dtako-staging"

# ローカル (`wrangler dev --env local`) 専用。deploy しない。
# binding を持たない (binding は env に継承されない) ので、src/db.rs は文字列 DATABASE_URL の段で繋ぐ。
# --env なしの `wrangler dev` は、トップレベルの DTAKO_HYPERDRIVE の段に入り、ローカルの DATABASE_URL の段へは進まない
[env.local]
name = "alc-dtako-local"
workers_dev = false
preview_urls = false
