# デジタコの運行 CSV のアップロード・分割の Worker。rust-alc-api を Cloudflare Workers へ段階移行する 2 本目
# (Refs ippoan/rust-alc-api#725)。型は 1 本目の ippoan/alc-vein-worker に合わせる。
# 直下の package が worker、route の crate は crates/alc-dtako-upload (同じ workspace・lock は直下の 1 つ)。
#
# 口と分割の流れは crates/alc-dtako-upload に在り、この Worker が持つのは DB への経路 (`src/db.rs`)・
# R2 の binding を保存先の層に載せる実装 (`src/r2.rs`)・workers-rs への載せ方 (`src/lib.rs`) だけ。
[package]
name = "alc-dtako-worker"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[workspace]
members = ["crates/alc-dtako-upload", "crates/alc-compare", "crates/alc-csv-parser"]

# alc-core-wasm は ippoan/rust-alc-api に残る。git 依存・rev 固定で引き、**書くのはここ 1 か所だけ**
# (worker と crates/alc-dtako-upload は `workspace = true` で継承する)。出どころが 2 つになると `TenantId` が
# 別の型になり、コンパイルは通るのに全リクエストが 500 になる (layer が入れる型と route が取り出す型が合わない)。
# rev を上げるときは Cargo.lock も一緒に更新する (CLAUDE.md)。
# alc-worker-db (ippoan/alc-worker-kit) も同じ (出どころを 2 つにしない。`PgClient` が別の型になる)。
# alc-worker-db の rev は ippoan/alc-vein-worker と揃えている。
# alc-csv-parser・alc-compare の正本はこの repo の crates/ (ippoan/rust-alc-api の 79029aa から写した。Refs ippoan/rust-alc-api#736)。
# path 依存で、書くのはここ 1 か所だけ (出どころを 2 つにしない)。
[workspace.dependencies]
alc-core-wasm = { git = "https://github.com/ippoan/rust-alc-api", rev = "e14431855deb4ac6d3937af3c7db86addc7db9e7" }
# 分割の純粋な部分 (`split_csv_entry`・`cap_sorted`)。backend と同じ関数を呼ぶ (写さない)。
# zip の展開 (feature `zip-extract`) は引かない (zip の既定 features が C の依存を連れてきて wasm32 に載らない)
alc-csv-parser = { path = "crates/alc-csv-parser", default-features = false }
# 日別の集計の計算 (`upload_daily::compute_daily_hours`)。backend と同じ関数を呼ぶ
alc-compare = { path = "crates/alc-compare" }
alc-worker-db = { git = "https://github.com/ippoan/alc-worker-kit", rev = "6e8b169846e068a93fa367f963a578b7422f5db8", features = ["chrono"] }

# 使わない依存は入れない
[dependencies]
alc-core-wasm = { workspace = true }
alc-dtako-upload = { path = "crates/alc-dtako-upload" }
alc-worker-db = { workspace = true }
axum = { version = "0.8", default-features = false }
# state に持たせる `PgClient` の async の Mutex と、R2 の future を返す `BoxFuture`
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio-postgres = { version = "0.7", default-features = false, features = ["js"] }
tower-service = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
worker = { version = "0.8", features = ["http", "axum", "tokio-postgres"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
